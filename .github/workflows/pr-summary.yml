name: 🤖 Claude Copilot PR Summary for iOS

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  summarize-pr:
    name: Generate PR Summary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff and changed files
        id: pr_info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Collect changed files with their status
          gh pr view ${{ github.event.pull_request.number }} \
            --json files,title,body,additions,deletions,commits \
            > pr_meta.json

          # Get full diff — Swift, config, and resource files only
          git diff origin/${{ github.base_ref }}...HEAD \
            -- '*.swift' '*.m' '*.h' '*.c' '*.xib' '*.storyboard' \
               '*.xcconfig' '*.plist' '*.yaml' '*.yml' '*.json' \
               'Package.swift' 'Package.resolved' 'Podfile' 'Podfile.lock' \
               'ci_scripts/**' '.github/**' \
            | head -c 32000 > pr_diff.txt

          # Summarise stats for the prompt
          ADDITIONS=$(jq '.additions' pr_meta.json)
          DELETIONS=$(jq '.deletions' pr_meta.json)
          COMMITS=$(jq '.commits | length' pr_meta.json)
          FILES=$(jq '.files | length' pr_meta.json)
          FILE_LIST=$(jq -r '.files[].path' pr_meta.json | tr '\n' ', ')

          echo "additions=$ADDITIONS"  >> $GITHUB_OUTPUT
          echo "deletions=$DELETIONS"  >> $GITHUB_OUTPUT
          echo "commits=$COMMITS"      >> $GITHUB_OUTPUT
          echo "files=$FILES"          >> $GITHUB_OUTPUT
          echo "file_list=$FILE_LIST"  >> $GITHUB_OUTPUT

      - name: Generate summary with Claude
        id: claude_summary
        uses: actions/github-script@v7
        env:
          ANTHROPIC_GH_API_KEY: ${{ secrets.ANTHROPIC_GH_API_KEY }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            const diff    = fs.existsSync('pr_diff.txt')
                              ? fs.readFileSync('pr_diff.txt', 'utf8').slice(0, 28000)
                              : '(diff unavailable)';
            const prMeta  = JSON.parse(fs.readFileSync('pr_meta.json', 'utf8'));
            const title   = prMeta.title || '';
            const files   = (prMeta.files || []).map(f => f.path);
            const additions = prMeta.additions ?? 0;
            const deletions = prMeta.deletions ?? 0;
            const commits   = (prMeta.commits || []).length;

            // --- Classify change types from iOS file paths ---
            const isNewFeature = files.some(f =>
              /View\.swift$|ViewController\.swift$|ViewModel\.swift$|Screen\.swift$/.test(f)
            );
            const isRefactor = files.some(f =>
              /Manager|Repository|Service|Coordinator|Router|Store/.test(f)
            );
            const isTest = files.some(f =>
              /Tests?\.swift$|Spec\.swift$|test\//i.test(f)
            );
            const isUI = files.some(f =>
              /\.xib$|\.storyboard$|Color|Theme|Style|Asset/.test(f)
            );
            const isConfig = files.some(f =>
              /\.xcconfig$|\.plist$|Package\.swift$|Podfile|ci_scripts|\.github/.test(f)
            );
            const isPerfOrFix = files.some(f =>
              /Fix|Bug|Crash|Patch|Hotfix/i.test(f)
            );
            const isCICD = files.some(f =>
              /ci_scripts|\.github|fastlane|Fastfile|Matchfile/.test(f)
            );

            // --- Build Claude prompt ---
            const prompt = `
            You are a senior iOS engineer reviewing a pull request for the Brainwallet iOS app
            (Swift, SwiftUI + UIKit hybrid, AppDelegate architecture, Firebase Analytics/Crashlytics,
            Xcode Cloud CI, Swift Package Manager dependencies).

            Repository layout:
            - brainwallet/                  → Main app source (Swift, SwiftUI Views, ViewControllers)
            - brainwallet/PreLaunchResources/ → GoogleService-Info.plist stub and pre-launch assets
            - BrainwalletUnitTests/         → XCTest unit test suite
            - BrainwalletUITests/           → XCUITest UI test suite
            - Modules/                      → SPM local modules
            - Private/                      → Private keys / provisioning (gitignored in prod)
            - ci_scripts/                   → Xcode Cloud custom build scripts
            - .github/                      → GitHub Actions workflows
            - fastlane/                     → Fastlane lanes (scan, match, deliver)
            - BrainwalletHybrid.xcworkspace → Workspace root

            PR title: ${title}
            Files changed (${files.length}): ${files.join(', ')}
            Additions: ${additions}  Deletions: ${deletions}  Commits: ${commits}

            Diff (truncated to 28 000 chars):
            \`\`\`diff
            ${diff}
            \`\`\`

            Write a GitHub PR description using EXACTLY this markdown template.
            Fill every section accurately from the diff. Do not add sections or change headings.

            ---
            ## 📱 Description
            <2–4 sentence plain-English summary of what this PR does and why>

            ## Platform
            - [x] **iOS**

            ## 🎯 Type of Change
            - [${isPerfOrFix  ? 'x' : ' '}] 🐛 Bug fix
            - [${isNewFeature ? 'x' : ' '}] ✨ New feature
            - [${isRefactor   ? 'x' : ' '}] 🔧 Refactoring (code change that neither fixes a bug nor adds a feature)
            - [ ] 📚 Documentation update
            - [${isUI         ? 'x' : ' '}] 🎨 UI/UX improvement
            - [ ] ⚡ Performance improvement
            - [${isTest       ? 'x' : ' '}] 🧪 Test addition or improvement
            - [${isCICD       ? 'x' : ' '}] ⚙️ CI/CD change

            ## 📋 Changes
            ### New Components Added
            <bullet list of new files/classes and what each does, or "None">

            ### Modifications
            <bullet list of modified files and what changed in each>

            ### Removals
            <bullet list of deleted files/classes and why, or "None">

            ## 📊 Statistics
            - **Additions:** ${additions} lines
            - **Deletions:** ${deletions} lines
            - **Files Changed:** ${files.length}
            - **Commits:** ${commits}

            ## 🔗 Related Issues
            - Fixes #
            - Related to #

            ## 🧪 Tests Status
            - [ ] Tests ran successfully locally?
            - [ ] Added or updated unit tests?
            - [ ] Added or updated UI tests?
            - [ ] Code coverage percentage of the codebase: __%

            ## 📸 Screenshots/Videos
            | Before | After |
            |--------|-------|
            | _Add screenshot_ | _Add screenshot_ |

            ## 🎯 Reviewers
            @kcw-grunt
            ---
            **Draft Status:** This PR is currently in draft mode and ready for review feedback.
            ---
            `;

            // --- Call Anthropic API ---
            const response = await fetch(
              'https://api.anthropic.com/v1/messages',
              {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'x-api-key': process.env.ANTHROPIC_GH_API_KEY,
                  'anthropic-version': '2023-06-01',
                },
                body: JSON.stringify({
                  model: 'claude-haiku-4-5-20251001',
                  messages: [{ role: 'user', content: prompt }],
                  max_tokens: 2048,
                }),
              }
            );

            const data = await response.json();

            if (!response.ok || !data.content) {
              console.log('API response status:', response.status);
              console.log('API response body:', JSON.stringify(data, null, 2));
              core.setFailed(`Anthropic API error: ${JSON.stringify(data)}`);
              return;
            }

            const summary = data.content[0].text;
            core.setOutput('summary', summary);
            fs.writeFileSync('pr_summary.md', summary);
            console.log('Summary generated successfully.');

      - name: Post summary as PR comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs   = require('fs');
            const body = fs.readFileSync('pr_summary.md', 'utf8');

            // Find and replace existing bot comment, or create a new one
            const { data: comments } = await github.rest.issues.listComments({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' &&
              c.body.includes('<!-- claude-pr-summary -->')
            );

            const fullBody = `<!-- claude-pr-summary -->\n> 🤖 _Auto-generated by Claude — edit as needed before merging._\n\n${body}`;

            if (botComment) {
              await github.rest.issues.updateComment({
                owner:      context.repo.owner,
                repo:       context.repo.repo,
                comment_id: botComment.id,
                body:       fullBody,
              });
              console.log('Updated existing summary comment.');
            } else {
              await github.rest.issues.createComment({
                owner:        context.repo.owner,
                repo:         context.repo.repo,
                issue_number: context.issue.number,
                body:         fullBody,
              });
              console.log('Created new summary comment.');
            }