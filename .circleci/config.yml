# .circleci/config.yml
# Use the latest 2.1 version of CircleCI pipeline process engine.
# See: https://circleci.com/docs/2.0/configuration-reference
# Inspired by: https://medium.com/uptech-team/swift-package-manager-and-how-to-cache-it-with-ci-14968cd58c5f
version: 2.1
orbs:
  macos: circleci/macos@2
  ruby: circleci/ruby@2.5.3
jobs:
  build-unit-tests-per-push:
    macos:
      xcode: 16.4.0
    resource_class: macos.m1.medium.gen1
    working_directory: ~/ios/
    environment:
      HOMEBREW_NO_AUTO_UPDATE: 1
      FASTLANE_SKIP_UPDATE_CHECK: 1
      FL_OUTPUT_DIR: output
      FASTLANE_LANE: run_unit_tests_iPhone16ProMax
      XCODE_SCHEME: brainwalletUnitTests
      XCODE_PROJECT: brainwallet.xcodeproj
      FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 120
      FASTLANE_XCODEBUILD_SETTINGS_RETRIES: 3
    shell: /bin/bash --login -o pipefail
    steps:
      - add_ssh_keys:
          fingerprints:
            - "SHA256:Z4bsDPFhTv8vuTERTBcs6b5RHFRspyI77b7tQUsju1g"
      - checkout
      
      # Restore all caches
      - restore_cache:
          name: Restore caches
          keys:
            - combined-cache-v1-{{ arch }}-{{ checksum "Gemfile" }}-{{ checksum "Package.resolved" }}-{{ checksum "brainwallet.xcodeproj/project.pbxproj" }}
            - combined-cache-v1-{{ arch }}-{{ checksum "Gemfile" }}-{{ checksum "Package.resolved" }}-
            - combined-cache-v1-{{ arch }}-{{ checksum "Gemfile" }}-
            - combined-cache-v1-{{ arch }}-
      
      # Setup Ruby, clean environment, and install dependencies
      - run:
          name: Setup Ruby environment and dependencies
          command: |
            # Install Ruby with rbenv
            export PATH="$HOME/.rbenv/bin:$PATH"
            if ! command -v rbenv &> /dev/null; then
              brew update
              brew install rbenv ruby-build
            fi
            eval "$(rbenv init -)"
            rbenv install -s 3.3.0
            rbenv global 3.3.0
            ruby -v
            
            # Clean gem environment
            rm -f Gemfile.lock
            rm -rf vendor/bundle
            gem uninstall fastlane -aIx || true
            gem uninstall scan -aIx || true
            gem cleanup
            
            # Install Bundler and dependencies
            gem install bundler:2.6.9
            bundle config set --local path 'vendor/bundle'
            bundle install --jobs=4 --retry=3
      # Setup SSH &  GH Token and initialize submodules 
      - run:
          name: Configure Github Auth & Setup SSH and submodules
          command: |
            echo 'github.com ssh-rsa SHA256:Z4bsDPFhTv8vuTERTBcs6b5RHFRspyI77b7tQUsju1g' >> ~/.ssh/known_hosts
            ssh-add ~/.ssh/id_rsa_*
            sed -i "s#https://github.com/#https://${GH_TOKEN}@github.com/#g" .gitmodules
            git submodule init && git submodule update --init Modules/core && git submodule update --init Private/general-purpose
      - run:
          name: Setup environment files
          command: |
            # Export environment variables
            echo 'export BRAINWALLET_IOS_STOREKIT_V1_0_FILE="$BRAINWALLET_IOS_STOREKIT_V1_0_FILE"' >> $BASH_ENV
            echo 'export GOOGLE_SERVICES_PLIST="$GOOGLE_SERVICES_PLIST"' >> $BASH_ENV
            echo 'export REMOTE_CONFIG_DEFAULTS="$REMOTE_CONFIG_DEFAULTS"' >> $BASH_ENV
            echo 'export DEBUG_SERVICE_DATA="$DEBUG_SERVICE_DATA"' >> $BASH_ENV
            
            # Create environment files in root directory (required by Xcode build)
            echo "$BRAINWALLET_IOS_STOREKIT_V1_0_FILE" | base64 --decode > Brainwallet-StoreKit-v1.storekit
            echo "$GOOGLE_SERVICES_PLIST" | base64 --decode > GoogleService-Info.plist
            echo "$REMOTE_CONFIG_DEFAULTS" | base64 --decode > remote-config-defaults.plist
            echo "$DEBUG_SERVICE_DATA" | base64 --decode > service-data.plist
            
            # Fail fast on a bad env var here instead of a cryptic
            # "unable to read input file as a property list" from xcodebuild's
            # CopyPlistFile step later (this exact failure mode hit Xcode
            # Cloud build 431: DEBUG_SERVICE_DATA didn't decode to a valid
            # plist). Naming the broken var/file points straight at what to
            # fix in the CircleCI project env vars.
            check_plist() {
              if [ ! -s "$2" ] || ! /usr/libexec/PlistBuddy -c "Print" "$2" >/dev/null 2>&1; then
                echo "ERROR: $1 did not decode to a valid plist -- check its value in CircleCI's project env vars"
                exit 1
              fi
            }
            check_plist "GOOGLE_SERVICES_PLIST -> GoogleService-Info.plist" GoogleService-Info.plist
            check_plist "REMOTE_CONFIG_DEFAULTS -> remote-config-defaults.plist" remote-config-defaults.plist
            check_plist "DEBUG_SERVICE_DATA -> service-data.plist" service-data.plist
            # Brainwallet-StoreKit-v1.storekit is JSON (Xcode's StoreKit
            # Configuration format), not a plist -- plutil -lint rejects JSON
            # outright, so validate with a real JSON parser instead.
            if [ ! -s "Brainwallet-StoreKit-v1.storekit" ] || ! python3 -m json.tool Brainwallet-StoreKit-v1.storekit >/dev/null 2>&1; then
              echo "ERROR: BRAINWALLET_IOS_STOREKIT_V1_0_FILE -> Brainwallet-StoreKit-v1.storekit did not decode to valid JSON -- check its value in CircleCI's project env vars"
              exit 1
            fi

            echo "GoogleService-Info.plist created successfully:"
            ls -la GoogleService-Info.plist
            echo "File size: $(wc -c < GoogleService-Info.plist) bytes"
            # Do NOT print file contents here -- this repo is public and
            # CircleCI build logs for public GitHub repos are viewable
            # without a CircleCI login by default, so dumping any lines of a
            # decoded secret (this file's API_KEY, GOOGLE_APP_ID, etc.) would
            # leak it. check_plist above already validates the content is a
            # real plist without printing it; that's the right way to verify
            # this, not head/cat.

            # Also copy to brainwallet directory if needed
            mkdir -p ./brainwallet
            cp Brainwallet-StoreKit-v1.storekit ./brainwallet/PreLaunchResources/
            cp GoogleService-Info.plist ./brainwallet/PreLaunchResources/
            cp remote-config-defaults.plist ./brainwallet/PreLaunchResources/
            cp service-data.plist ./brainwallet/PreLaunchResources/
            
            # Verify copies were successful
            echo "Files in brainwallet directory:"
            ls -la ./brainwallet/

      # Prepare build environment
      - run:
          name: Prepare build environment
          command: |
            # Clean derived data
            rm -rf ~/Library/Developer/Xcode/DerivedData
            rm -rf ./DerivedData
            
            # Boot simulator
            DEVICE_ID=$(xcrun simctl list devices | grep "iPhone 16 Pro Max" | grep -v "unavailable" | head -1 | sed 's/.*(//' | sed 's/).*//')
            if [ -n "$DEVICE_ID" ]; then
              echo "Booting iPhone 16 Pro Max simulator..."
              xcrun simctl boot "$DEVICE_ID" || echo "Device may already be booted"
              sleep 10
            else
              echo "iPhone 16 Pro Max not found, using available device"
              xcrun simctl list devices
            fi 
      - run:
          name: Verify build prerequisites
          command: |
            pwd
            echo "Verifying GoogleService-Info.plist is available for xcodebuild:"
            
            # Check root directory
            if [ -f "GoogleService-Info.plist" ]; then
              echo "✅ GoogleService-Info.plist found in root directory"
              ls -la GoogleService-Info.plist
            else
              echo "❌ GoogleService-Info.plist NOT found in root directory"
            fi
            
            # Check brainwallet subdirectory
            if [ -f "./brainwallet/GoogleService-Info.plist" ]; then
              echo "✅ GoogleService-Info.plist found in brainwallet directory"
              ls -la ./brainwallet/GoogleService-Info.plist
            else
              echo "❌ GoogleService-Info.plist NOT found in brainwallet directory"
            fi
            
            # Find all plist files for debugging
            echo "All .plist files in project:"
            find . -name "*.plist" -type f
            
            # Ensure at least one GoogleService-Info.plist exists
            if [ ! -f "GoogleService-Info.plist" ] && [ ! -f "./brainwallet/GoogleService-Info.plist" ]; then
              echo "ERROR: GoogleService-Info.plist not found in any expected location!"
              exit 1
            fi
            
            echo "✅ All build prerequisites verified"
  # ── i18n coverage check ────────────────────────────────────────────────────
  # Lightweight informational job: runs on Linux (no Mac machine needed),
  # reports translation coverage per language, and fails the pipeline only
  # if any language drops below COVERAGE_WARN_PCT (default 80 %).
  # It never blocks a release for in-flight translations — raise the threshold
  # once the auto-translate workflow has caught up.
      - run:
          name: Check i18n coverage
          command: python3 scripts/test_i18n_coverage.py

      - run:
          name: Run Fastlane iPhone 16 simulator Tests
          command: |
            export PATH="$HOME/.rbenv/bin:$PATH"
            eval "$(rbenv init -)"
            bundle exec fastlane $FASTLANE_LANE
      - save_cache:
          name: Save combined cache
          key: combined-cache-v1-{{ arch }}-{{ checksum "Gemfile" }}-{{ checksum "Package.resolved" }}-{{ checksum "brainwallet.xcodeproj/project.pbxproj" }}
          paths:
            - ~/.rbenv
            - vendor/bundle
            - ~/.gem
            - SourcePackages/
            - ~/Library/Caches/org.swift.swiftpm/
            - ~/Library/org.swift.swiftpm/
            - ./DerivedData
            - ~/Library/Developer/Xcode/DerivedData
            - ~/Library/Caches/com.apple.dt.Xcode/
      # Store artifacts and handle failures
      - run:
          name: Capture crash logs
          command: |
            find ~/Library/Logs/DiagnosticReports -name "*Brainwallet*" -type f -exec echo "Found crash log: {}" \; -exec cat {} \; || echo "No crash logs found"
            find ~/Library/Developer/CoreSimulator/Devices/*/data/Library/Logs/CrashReporter/ -name "*Brainwallet*" -type f -exec echo "Found simulator crash log: {}" \; -exec cat {} \; || echo "No simulator crash logs found"
            log show --predicate 'process == "Brainwallet"' --last 10m || echo "No system logs found for Brainwallet"
          when: on_fail
      - store_test_results:
          path: test_output
      - store_artifacts:
          path: ~/Library/Logs/DiagnosticReports
          destination: crash-logs
          when: on_fail
      - run:
          name: "Update tests-passed badge (shields.io gist endpoint)"
          # Only the primary branch's run should own the badge state - a feature
          # branch with fewer/broken tests shouldn't flap the README badge.
          # Requires GIST_TOKEN (a PAT with only the `gist` scope) and GIST_ID
          # to be set as CircleCI project env vars.
          when: always
          command: |
            if [ "$CIRCLE_BRANCH" != "develop" ]; then
              echo "Not on develop, skipping badge update."
              exit 0
            fi
            if [ -z "$GIST_TOKEN" ] || [ -z "$GIST_ID" ]; then
              echo "GIST_TOKEN/GIST_ID not set, skipping badge update."
              exit 0
            fi

            f="test_output/report.junit"
            total=0
            failures=0
            skipped=0
            if [ -f "$f" ]; then
              total=$(grep -o 'tests="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*')
              failures=$(grep -o 'failures="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*')
              skipped=$(grep -o 'skipped="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*')
            fi
            passed=$(( ${total:-0} - ${failures:-0} - ${skipped:-0} ))

            if [ "${failures:-0}" -gt 0 ]; then
              message="${passed} passed, ${failures} failed"
              color="red"
            else
              message="${passed} passed"
              color="brightgreen"
            fi

            payload=$(printf '{"files":{"tests-badge.json":{"content":"{\\"schemaVersion\\":1,\\"label\\":\\"tests\\",\\"message\\":\\"%s\\",\\"color\\":\\"%s\\"}"}}}' "$message" "$color")

            curl -s -X PATCH \
              -H "Authorization: token ${GIST_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/gists/${GIST_ID}" \
              -d "$payload" > /dev/null

            echo "Badge updated: ${message}"

workflows:
  version: 4
  
  # Main workflow - runs unit tests on every push
  build-test-brainwallet-ios:
    jobs:
      - build-unit-tests-per-push:
          context:
            - bw-ios-test 
